# Doodle Desk — static site, nothing to build.
# Every page is plain HTML/CSS/JS, so Netlify just serves this folder as-is.

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Fingerprint-free filenames, so let the browser revalidate rather than
# serve a stale board engine after a deploy.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
