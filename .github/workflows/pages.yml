# Publishes the site to GitHub Pages.
#
# The site is plain HTML/CSS/JS, so there is nothing to build — this just
# assembles the files that should be served and hands them to Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/affectionate-tesla-vj0hkk
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure Pages
        # enablement: true turns Pages on the first time this runs, so the
        # repository does not need to be set up by hand beforehand.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble the site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='netlify.toml' \
            --exclude='node_modules' \
            ./ _site/
          # Stop Pages running the files through Jekyll
          touch _site/.nojekyll
          echo "Publishing:" && ls -1 _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
